version: "3.8"

services:

  # ─────────────────────────────────────────
  # MongoDB — eventos brutos por frame
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: recifavela_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: recifavela123
      MONGO_INITDB_DATABASE: recifavela
    volumes:
      - mongo_data:/data/db
    networks:
      - recifavela_net

  # ─────────────────────────────────────────
  # InfluxDB — métricas agregadas por turno
  # ─────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: recifavela_influx
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: recifavela123
      DOCKER_INFLUXDB_INIT_ORG: recifavela
      DOCKER_INFLUXDB_INIT_BUCKET: deteccoes
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: recifavela-super-secret-token
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - recifavela_net

  # ─────────────────────────────────────────
  # MinIO — armazenamento das imagens
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: recifavela_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: recifavela123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - recifavela_net

# ─────────────────────────────────────────
# Volumes persistentes
# ─────────────────────────────────────────
volumes:
  mongo_data:
  influx_data:
  minio_data:

# ─────────────────────────────────────────
# Rede compartilhada entre os serviços
# ─────────────────────────────────────────
networks:
  recifavela_net:
    driver: bridge